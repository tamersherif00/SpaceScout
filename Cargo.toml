[package]
name = "spacescout"
version = "0.1.0"
edition = "2021"
description = "Fast multi-threaded disk space analyzer for Windows"

[dependencies]
eframe = "0.31"
rayon = "1"
trash = "5"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
